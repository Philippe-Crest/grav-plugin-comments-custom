name: Comments (Unofficial Fork)
type: plugin
slug: comments
version: 1.2.8
description: Unofficial fork of Grav Comments 1.2.8. Adds only post-moderation tools in Admin (trash and restore). No frontend changes or YAML storage format changes.
icon: comment
author:
  name: Team Grav
  email: devs@getgrav.org
  url: http://getgrav.org
homepage: https://github.com/getgrav/grav-plugin-comments
keywords: guestbook, plugin
bugs: https://github.com/getgrav/grav-plugin-comments/issues
readme: https://github.com/getgrav/grav-plugin-comments/blob/develop/README.md
license: MIT

dependencies:
  - form
  - email

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
