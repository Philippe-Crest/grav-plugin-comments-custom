name: Comments (Unofficial Fork)
type: plugin
slug: comments
version: 1.2.8
description: Unofficial fork of Grav Comments 1.2.8. Adds only post-moderation tools in Admin (trash and restore). No frontend changes or YAML storage format changes.
icon: comment
author:
  name: DVST (Unofficial fork maintainer)
  url: https://github.com/Philippe-Crest/grav-plugin-comments-custom/tree/release/1.2.8-dvst.1
homepage: https://github.com/Philippe-Crest/grav-plugin-comments-custom/tree/release/1.2.8-dvst.1
keywords: comments, moderation, admin, guestbook, plugin
bugs: https://github.com/Philippe-Crest/grav-plugin-comments-custom/issues
readme: https://github.com/Philippe-Crest/grav-plugin-comments-custom/blob/release/1.2.8-dvst.1/README.md
changelog: https://github.com/Philippe-Crest/grav-plugin-comments-custom/blob/release/1.2.8-dvst.1/CHANGELOG.md
license: MIT

dependencies:
  - form
  - email

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
